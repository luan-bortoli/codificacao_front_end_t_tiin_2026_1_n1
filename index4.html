<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>
        <caption>Horário das Aulas da Semana</caption>
        <thead>
            <tr>
                <th scope="col">Dia da Semana</th>
                <th scope="col">Horário</th>
                <th scope="col">Unidade Curricular</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Segunda-Feira</td>
                <td>19:00 - 22:30</td>
                <td>Projetos de Front-End</td>
            </tr>
            <tr>
                <td>Terça-Feira</td>
                <td>19:00 - 22:30</td>
                <td></td>
            </tr>
            <tr>
                <td>Quarta - Feira</td>
                <td>19:00 - 22:30</td>
                <td>Codificação Para Front-End</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Intervalo: 20:00 - 20:15</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
